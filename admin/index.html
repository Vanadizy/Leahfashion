<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leah Fashion Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="auth-panel" id="auth-panel">
        <div>
          <p class="eyebrow">Leah Fashion</p>
          <h1>Admin CMS</h1>
          <p class="muted">
            Sign in to load the MySQL-backed site content and update the public website.
          </p>
        </div>

        <form id="login-form" class="stack">
          <label>
            Username
            <input id="username" type="text" value="admin" autocomplete="username" required />
          </label>
          <label>
            Password
            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit">Sign In</button>
          <p class="status" id="auth-status"></p>
        </form>
      </section>

      <section class="editor-panel hidden" id="editor-panel">
        <header class="editor-header">
          <div>
            <p class="eyebrow">Content Management</p>
            <h2>Site JSON Editor</h2>
            <p class="muted">
              Update the public site content below, then save to MySQL.
            </p>
          </div>

          <div class="header-actions">
            <a class="secondary-button" href="/" target="_blank" rel="noreferrer">Open Site</a>
            <button class="secondary-button" id="format-json" type="button">Format JSON</button>
            <button class="secondary-button" id="logout" type="button">Logout</button>
          </div>
        </header>

        <div class="editor-actions">
          <button id="reload-content" type="button">Reload Content</button>
          <button id="save-content" type="button">Save to Database</button>
        </div>

        <label class="editor-label" for="content-json">
          Site content JSON
          <textarea id="content-json" spellcheck="false"></textarea>
        </label>

        <p class="status" id="editor-status"></p>
      </section>
    </main>

    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
